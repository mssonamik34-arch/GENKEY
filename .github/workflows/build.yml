
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Keep the Android debug signing key across CI runs so APK updates
      # are signed by the same certificate. The key stays in Actions cache,
      # never in the repository.
      - name: Restore persistent Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: genkey-android-debug-signing-v1

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Publish direct APK download
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: GENKEY Latest APK
          artifacts: app/build/outputs/apk/debug/*.apk
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          body: |
            Latest GENKEY Android APK.
            Version: 1.0.${{ github.run_number }}
            Download and install on your Android phone.
